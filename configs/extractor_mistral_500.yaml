# Extractor profile: mistral_500
# Auto-generated for production sweep at 500-token chunks
# Model: mistral:latest, Chunk size: 500 tokens
#
# Reads from: silver/legislation/chunks_mistral_500/session={N}/_chunks.parquet
# Writes to:  silver/legislation/features_mistral_500/session={N}/_features.parquet

profile: mistral_500

sessions:
  - 2176

chunk_limit: null   # process all chunks in the comparison run

backend: vllm
prompt_path: prompts/feature_extraction_v1.txt
prompt_version: v1

flush_every_n_chunks: 25

vllm:
  base_url: http://localhost:8000/v1
  model_name: mistral-7b-awq
  timeout_seconds: 180
  temperature: 0.0
  top_p: 1.0
  max_tokens: 1024
  system_prompt: null

ollama:
  path: /usr/local/bin/ollama
  model_name: mistral:latest
  timeout_seconds: 180

slos:
  throughput_min:
    chunks_extracted_per_second: 0.10
  latency_max:
    api_time.p50: 15.0
    api_time.p99: 35.0
  counts_max:
    chunks_failed: 0
  ratio_max:
    - numerator: parse_partial
      denominator: chunks_extracted
      max: 0.30
